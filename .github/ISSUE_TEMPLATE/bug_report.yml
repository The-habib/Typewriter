name: Bug Report
description: Report a bug in the Android Keyboard App (app/) or the 3D Landing Page (web/)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the Typewriter monorepo is affected?
      options:
        - Android Keyboard (app/)
        - Companion App (app/)
        - 3D Landing Page (web/)
        - Documentation / CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Tap / click...
        3. See error...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device / Browser / OS Version
      placeholder: e.g. Android 14 (Pixel 7) or Chrome 131 on Windows 11
    validations:
      required: true
