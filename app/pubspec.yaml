name: typewriter_keyboard
description: "Typewriter — Mechanical Typewriter 3D Studio Edition: Open-Source Android Keyboard (IME) & Companion App"
homepage: https://the-habib.github.io/Typewriter/
repository: https://github.com/The-habib/Typewriter
issue_tracker: https://github.com/The-habib/Typewriter/issues
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/typewriter_logo.png
    - assets/dict/en_common.txt
  fonts:
    - family: Arvo
      fonts:
        - asset: assets/fonts/Arvo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arvo-Bold.ttf
          weight: 700
